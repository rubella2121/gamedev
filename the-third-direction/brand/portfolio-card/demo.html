<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Third Direction card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 40px; }
    h2 { margin: 0 0 12px; font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace; color: #7d8590; letter-spacing: .06em; text-transform: uppercase; }
    .narrow { max-width: 380px; }
    ttd-card { --ttd-mono: "JetBrains Mono", ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <section><h2>wide</h2><ttd-card></ttd-card></section>
    <section class="narrow"><h2>phone width</h2><ttd-card></ttd-card></section>
  </main>
  <script type="module" src="./ttd-card.js"></script>
</body>
</html>
