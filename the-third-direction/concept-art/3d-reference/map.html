/* ---------------- biomes ---------------- */
const PAL={
 stage:['#2a1622','#34192a','#221220','#3c1e30'], entry:['#d6cfb4','#c4bc9f','#dcd5be'], road:['#6a58a0','#5e4c94','#7260a8'],
 thicket:['#4a6a2a','#3e5a22','#5a4a28','#4a7a30'], marsh:['#14444f','#1b5a5a','#23707c','#103846'], bones:['#7a7660','#8e8a74','#68644e','#9a9680'],
 hollow:['#24405a','#1c3450','#2e4e6a','#2a2a5a'], meadow:['#1f6a3a','#2e8a4f','#2a7a6c','#3a9a5a'], rim:['#2a2048','#34285a']};
function biome(x,z){
  const d=Math.hypot(x,z), ph=phiOf(x,z)+(hash2(x*1.7,z*2.3)-0.5)*9;
  if(d<4.9) return 'meadow';

  if(pd(ph,180)<15 && d>12.2) return 'entry';
  if(ph>=27&&ph<90) return 'marsh';
  if(ph>=90&&ph<165) return 'bones';
  if(ph>=195&&ph<270) return 'hollow';
  return 'thicket';
}
const WELLS=[{r:5.4,a:204,name:'W1'},{r:11.6,a:236,name:'W2'},{r:13.4,a:308,name:'W3'}];
const PADS=[45,135,225,315].map((a,i)=>({r:9.5,a,name:'P'+(i+1)}));

const PILL_IN=[{a:45,kind:'bell'},{a:135,kind:'rib'},{a:225,kind:'lamp'},{a:315,kind:'arch'}].map(p=>({...p,r:6.8}));

const SPAWN=[0,12];

/* ---------------- the scene ---------------- */
const scene=new THREE.Scene(); scene.background=col('#07060f');
const hemi=new THREE.HemisphereLight(0x8a7ac8,0x1a1230,1.15); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xd8e0ff,1.05); sun.position.set(-14,30,16); scene.add(sun);
const extra=new THREE.DirectionalLight(0xbfc8ff,1.6); extra.position.set(60,-6,14); extra.visible=false; scene.add(extra);

const G={plan:new THREE.Group(),dress:new THREE.Group(),x:new THREE.Group(),col:new THREE.Group(),mash:new THREE.Group()};

// tiles
const tiles=[];
for(let x=-19;x<=19;x++)for(let z=-19;z<=19;z++){const d=Math.hypot(x,z); if(d<=R+0.3&&!(d>R-1.3&&hash2(x*3.1,z*7.7)<0.26)) tiles.push({x,z,d});}
// the bridge out of the 2D world: a few pale tiles, crumbling toward the void
for(let z=19;z<=27;z++)for(const x of [-1,0,1]){ if(z>22&&hash2(x*5.3,z*1.9)<0.3+(z-22)*0.08) continue; tiles.push({x,z,d:Math.hypot(x,z),bridge:true}); }
const tileGeo=new THREE.BoxGeometry(0.96,0.7,0.96);
const tileMesh=new THREE.InstancedMesh(tileGeo,new THREE.MeshLambertMaterial({color:0xffffff}),tiles.length); tileMesh.frustumCulled=false;
const m4=new THREE.Object3D();
const topY=(t)=>{ if(t.bridge) return -0.02; if(t.b==='marsh'&&hash2(t.x*2.2,t.z*1.3)>0.55) return -0.12; if(t.b==='meadow') return -0.1; if(t.d>14.8&&t.b!=='entry') return 0.32; if(t.b==='stage'&&t.d>12.4) return 0.18; return 0; };

  if(ringRoad && t.b!=='stage') key='road';
  const arr=PAL[key]; c=col(arr[Math.floor(h*arr.length)%arr.length]);
  if(t.d>R-1.5&&!t.bridge) c.multiplyScalar(0.7);
  if(t.b==='entry'&&!t.bridge&&t.d<15.5) c.lerp(col('#6a58a0'),Math.max(0,(15.5-t.d)/5));

});
G.plan.add(tileMesh);
// small things that sit on tiles (instanced, unlit so they glow)
{ const g=new THREE.ConeGeometry(0.12,0.5,5); const n=flowers.length*2; const im=new THREE.InstancedMesh(g,new THREE.MeshBasicMaterial({color:0xffffff,fog:false}),n); const r=rng(7); let k=0;
  const cs=['#ff9ec0','#9fe8ff','#ffe58a','#ffffff']; for(const t of flowers) for(let j=0;j<2;j++){ m4.position.set(t.x+(r()-0.5)*0.7,t.y+0.18,t.z+(r()-0.5)*0.7); m4.rotation.set(0,r()*3,0); m4.scale.setScalar(0.8+r()*0.8); m4.updateMatrix(); im.setMatrixAt(k,m4.matrix); im.setColorAt(k,col(cs[Math.floor(r()*4)])); k++; } G.plan.add(im); }
for(const t of crackGlow){ G.x.add(glow(0xff2a40,2.4,t.x,t.y+0.5,t.z,0.7)); }
for(const t of lampDots){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,6),bas(0xcfffe8)); m.position.set(t.x,t.y+0.2,t.z); G.plan.add(m); G.plan.add(glow(0x9fffd8,1.1,t.x,t.y+0.3,t.z,0.55)); }

const chev=canvasTex(128,128,(g)=>{g.clearRect(0,0,128,128);g.strokeStyle='#7fe8ff';g.lineWidth=14;g.lineCap='round';g.lineJoin='round';for(const y of [46,92]){g.beginPath();g.moveTo(30,y+26);g.lineTo(64,y-6);g.lineTo(98,y+26);g.stroke()}});

const rune=canvasTex(512,512,(g)=>{g.strokeStyle='#ff4a5e';g.lineWidth=8;g.beginPath();g.arc(256,256,236,0,7);g.stroke();g.lineWidth=4;g.beginPath();g.arc(256,256,196,0,7);g.stroke();g.lineWidth=5;for(let i=0;i<12;i++){const a=i/12*6.283;g.beginPath();g.moveTo(256+Math.cos(a)*196,256+Math.sin(a)*196);g.lineTo(256+Math.cos(a)*236,256+Math.sin(a)*236);g.stroke()}g.beginPath();for(let i=0;i<3;i++){const a=i/3*6.283-1.57;g.lineTo(256+Math.cos(a)*150,256+Math.sin(a)*150)}g.closePath();g.stroke();g.beginPath();g.arc(256,256,40,0,7);g.stroke()});
G.plan.add(decal(seal,3.6,SPAWN[0],SPAWN[1],0,0.39,0.95));
{const [bx,bz]=pol(15.6,0); G.plan.add(decal(rune,10.5,bx,bz,0,0.34,0.8)); G.x.add(decal(rune,10.5,bx,bz,0,0.35,0.0));}
for(const p of PADS){const [x,z]=pol(p.r,p.a); const dirx=Math.cos(p.a*Math.PI/180), dirz=Math.sin(p.a*Math.PI/180); // clockwise tangent in plan view
  const plate=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.16,2.3),lam('#2a2250')); plate.position.set(x,0.08,z); plate.rotation.y=-(p.a+90)*Math.PI/180+Math.PI; G.plan.add(plate);
  G.plan.add(decal(chev,2.0,x,z,-(p.a)*Math.PI/180,0.19,1)); G.plan.add(glow(0x7fe8ff,2.6,x,0.4,z,0.22)); p.x=x;p.z=z;}
for(const w of WELLS){const [x,z]=pol(w.r,w.a); const g=new THREE.Group(); g.position.set(x,0,z);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,0.28,8,28),lam('#4a3d6a')); ring.rotation.x=Math.PI/2; ring.position.y=0.22; g.add(ring);
  const pool=new THREE.Mesh(new THREE.CircleGeometry(1.2,28),bas(0x9fe8ff)); pool.rotation.x=-Math.PI/2; pool.position.y=0.3; g.add(pool);
  const r=rng(Math.floor(x*91+z*13)+5); for(let i=0;i<14;i++){const a=i/14*6.283+r()*0.3; const f=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.7+r()*0.5,5),bas(i%3?0xcff6ff:0xffb0d0)); f.position.set(Math.cos(a)*1.55,0.45,Math.sin(a)*1.55); f.rotation.z=(r()-0.5)*0.4; g.add(f)}
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.25,6,20,1,true),new THREE.MeshBasicMaterial({color:0x9fe8ff,transparent:true,opacity:0.13,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false})); shaft.position.y=3.2; g.add(shaft);
  g.add(glow(0x9fe8ff,3.4,0,0.9,0,0.4)); G.plan.add(g); w.x=x;w.z=z;}
for(const c of CRYS){const [x,z]=pol(c.r,c.a); const g=new THREE.Group(); g.position.set(x,0.32,z); const r=rng(Math.floor(x*31+z*7)+9);
  for(let i=0;i<3;i++){const h=i?0.9+r()*0.5:1.9; const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.5,0),bas(i?0x7fe8ff:0xcff6ff)); m.scale.set(0.55,h,0.55); m.position.set((i?(r()-0.5)*1.1:0),h*0.5,(i?(r()-0.5)*1.1:0)); m.rotation.y=r()*3; g.add(m)}
  g.add(glow(0x7fe8ff,3.0,0,1.2,0,0.5)); G.plan.add(g); c.x=x;c.z=z;}
// themed pillars
function pillar(kind,x,z,out){const g=new THREE.Group(); g.position.set(x,0,z); const sc=out?1:0.92;
  if(kind==='bell'){ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.4,3.6,8),lam('#3a5a64')); post.position.y=1.8; g.add(post);
    const bell=new THREE.Mesh(new THREE.ConeGeometry(1.0,1.3,14,1,true),new THREE.MeshLambertMaterial({color:0xe0b84a,emissive:0x6a4a10,emissiveIntensity:0.6,side:THREE.DoubleSide})); bell.position.set(0,3.7,0); bell.rotation.x=Math.PI; g.add(bell);
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.5,1.5),lam('#2a4a56')); base.position.y=0.25; g.add(base);}
  if(kind==='rib'){ for(let i=0;i<3;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.19,6,16,Math.PI),lam('#c8c2a8')); t.rotation.y=i*Math.PI/3+0.3; t.position.y=0.1; g.add(t)} const sp=new THREE.Mesh(new THREE.BoxGeometry(0.3,2.9,0.3),lam('#aaa48c')); sp.position.y=1.4; g.add(sp);}
  if(kind==='lamp'){ const st=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.34,2.8,7),lam('#2a3a48')); st.position.y=1.4; g.add(st); const cap=new THREE.Mesh(new THREE.SphereGeometry(1.15,14,8,0,6.283,0,Math.PI/2),new THREE.MeshLambertMaterial({color:0x9fffd8,emissive:0x3aa88a,emissiveIntensity:0.9})); cap.position.y=2.8; g.add(cap); g.add(glow(0x9fffd8,5,0,3.1,0,0.6)); const base=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.4,1.4),lam('#1a2a3a')); base.position.y=0.2; g.add(base);}
  if(kind==='arch'){ for(const s of [-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(0.55,3.2,0.55),lam('#4a3a22')); p.position.set(s*1.0,1.6,0); p.rotation.z=-s*0.08; g.add(p)} const l=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.5,0.6),lam('#3a5a2a')); l.position.set(0,3.25,0); g.add(l); for(let i=0;i<4;i++){const v=new THREE.Mesh(new THREE.ConeGeometry(0.1,1.2,5),lam('#2e7a3a')); v.position.set(-1+i*0.66,2.7,0.35); v.rotation.z=Math.PI; g.add(v)}}
  g.scale.setScalar(sc); return g}
for(const p of PILL_IN){const [x,z]=pol(p.r,p.a); G.plan.add(pillar(p.kind,x,z,false)); p.x=x;p.z=z}
for(const p of PILL_OUT){const [x,z]=pol(p.r,p.a); G.plan.add(pillar(p.kind,x,z,true)); p.x=x;p.z=z}
// terrace parapet: low blocks on the rim, open at the entry and in front of the boss
{ const g=new THREE.BoxGeometry(1.2,0.6,0.5); const r=rng(3); const list=[]; for(let a=0;a<360;a+=7){ if(pd(a,180)<14||pd(a,0)<24) continue; if(r()<0.2) continue; list.push(a)} const im=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({color:0xffffff}),list.length); list.forEach((a,i)=>{const [x,z]=pol(17.2,a); m4.position.set(x,0.95,z); m4.rotation.set(0,-a*Math.PI/180,0); m4.scale.set(1,1,1); m4.updateMatrix(); im.setMatrixAt(i,m4.matrix); im.setColorAt(i,col(['#4a3d6a','#5a4a8a','#3a2f5c'][i%3]))}); G.plan.add(im) }

// the blob (a quick stand-in with the new design: gumdrop, tuft, back shell with 3 sockets)
function makeBlob(pips=2){const g=new THREE.Group(); const gold=new THREE.MeshLambertMaterial({color:0xf2d36b,emissive:0x8a6420,emissiveIntensity:0.75}); const amber=new THREE.MeshLambertMaterial({color:0xd9a93a,emissive:0x5a3a10,emissiveIntensity:0.6});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.62,24,18),gold); body.scale.set(1,1.06,0.95); body.position.y=0.78; g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.42,16,12),new THREE.MeshBasicMaterial({color:0xfff1a6,transparent:true,opacity:0.55})); belly.position.set(0,0.62,0.4); g.add(belly);
  const t1=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.5,6),gold); t1.position.set(0.02,1.62,-0.02); t1.rotation.z=-0.18; g.add(t1); const t2=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.3,6),gold); t2.position.set(0.15,1.5,0); t2.rotation.z=-1.0; g.add(t2);
  const shell=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,12),amber); shell.scale.set(1,1,0.55); shell.position.set(0,1.0,-0.5); g.add(shell);
  for(let i=0;i<3;i++){const a=2.55-i*1.0; const p=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),bas(i<pips?0xffffff:0x4a2c0a)); p.position.set(Math.cos(a)*0.24,1.0+Math.sin(a)*0.24+0.03,-0.74); g.add(p); if(i<pips) g.add(glow(0xfff1a6,0.5,Math.cos(a)*0.24,1.0+Math.sin(a)*0.24+0.03,-0.78,0.9));}
  for(const s of [-1,1]){const f=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,8),amber); f.scale.set(1,0.55,1.25); f.position.set(s*0.3,0.14,0.05); g.add(f); const a=new THREE.Mesh(new THREE.SphereGeometry(0.15,10,8),gold); a.position.set(s*0.66,0.78,0.04); g.add(a);
    const e=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),bas(0xffffff)); e.scale.set(0.8,1.1,0.4); e.position.set(s*0.24,0.95,0.55); g.add(e); const pu=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,6),bas(0x3a1020)); pu.scale.set(0.8,1.2,0.5); pu.position.set(s*0.24,0.93,0.62); g.add(pu);}
  g.add(glow(0xffd070,3.6,0,0.9,0,0.55)); const L=new THREE.PointLight(0xffd070,1.1,9,1.6); L.position.set(0,1.4,0.6); g.add(L); g.scale.setScalar(1.25); return g}
const blob=makeBlob(2); blob.position.set(SPAWN[0],0.34-0.34,SPAWN[1]); blob.rotation.y=Math.PI; G.dress.add(blob);
// moth
{const m=new THREE.Group(); for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(0.75,0.55),new THREE.MeshBasicMaterial({color:0xcff6ff,side:THREE.DoubleSide,transparent:true,opacity:0.92})); w.position.x=s*0.38; w.rotation.set(0.3,0,-s*0.5); m.add(w)} m.add(glow(0x7fe8ff,2.4,0,0,0,0.5)); m.position.set(-1.9,2.5,SPAWN[1]+0.3); G.dress.add(m)}

// the island underneath
{ const pts=[[R+0.4,-0.35],[R+0.2,-1.2],[R-1,-3.0],[R-4,-5.6],[R-8,-8.8],[R-12,-12.8],[3.4,-17.5],[0.7,-23]].map(([x,y])=>new THREE.Vector2(x,y)); const geo=new THREE.LatheGeometry(pts,30); const p=geo.getAttribute('position'); const v=new THREE.Vector3();
