<!doctype html>
<html><head><meta charset="utf-8"><title>The Pressed World: what the player sees</title>
<!-- the game's own stylesheet, so the HUD over these pictures is the real one -->
<link rel="stylesheet" href="/src/style.css">
<style>
  html,body{margin:0;padding:0;width:auto;height:auto;overflow:visible;display:block;background:#07070f;}
  #sheet{width:1800px;height:1880px;position:relative;overflow:hidden;background:radial-gradient(1100px 1100px at 70% 20%,#1c1440 0%,#0d0a22 55%,#07070f 100%);font-family:'DejaVu Sans Mono',ui-monospace,Menlo,Consolas,monospace;color:#e8e2d0}
  .abs{position:absolute}
  .h{font-weight:700;letter-spacing:.2em;color:#f2d36b}
  .cap{color:#9a93b8;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .ph2{position:absolute;width:400px}
  .ph2 .stage{position:relative;width:400px;height:711px;aspect-ratio:auto;max-width:none;max-height:none;border:2px solid #3b2e5c;border-radius:18px;box-shadow:0 0 40px rgba(120,90,255,.18)}
  .ph2 .stage img.shot{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
  .pc{margin-top:12px;font-size:13.5px;line-height:1.5;color:#cfc8e8}
  .pc b{display:block;font-size:15px;letter-spacing:.1em;color:#ffe9a0;text-transform:uppercase;margin-bottom:2px}
  .pc em{font-style:normal;color:#9a93b8}
  .ph2 .stage .goal{top:calc(var(--u) * 19.5)}
  .tag{display:inline-block;padding:0 7px;border-radius:5px;font-size:11px;letter-spacing:.08em;margin-right:6px;vertical-align:1px}
  .tag.g{border:1.5px solid #9fe8ff;color:#9fe8ff}
  .tag.n{border:1.5px solid #ff9a3a;color:#ff9a3a}
</style></head><body><div id="sheet">

<div class="abs h" style="left:48px;top:26px;font-size:46px">WHAT THE PLAYER SEES</div>
<div class="abs cap" style="left:50px;top:92px">the same 9:16 screen and the same HUD as the game, over the explorable world · concept renders, not in-game</div>
<div id="grid"></div>
<div class="abs cap" style="left:50px;top:1840px;font-size:12px;letter-spacing:.1em"><span style="color:#9fe8ff">game line</span> = a line the game already has · <span style="color:#ff9a3a">new line</span> = a proposal in the game's voice · concept only: nothing in this sheet is in the game yet</div>

<script>
const heart='<svg class="heart" viewBox="0 0 7 6"><path d="M1 0h2v1H1z M4 0h2v1H4z M0 1h7v2H0z M1 3h5v1H1z M2 4h3v1H2z M3 5h1v1H3z"/></svg>';
const FR=[
 {img:'portrait/landing.jpg',t:'1 · landing',n:'The way in: the entry bridge, the Garden ahead, X on its stage, the whole wall behind.',
  hearts:3,max:3,light:0,dash:[1,1],zone:['The Pressed Garden','far below, the forest hangs like a pressed flower.'],goal:'find mother and father · 0 of 3 gates open',tag:['n','new card']},
 {img:'portrait/explore.jpg',t:'2 · exploring',n:'A well to heal at, a surge pad, and the first pinned gate: shut until X falls.',
  hearts:3,lost:1,max:3,light:1.5,dash:[1,1],hint:'pinned shut · beat x first',goal:'find mother and father · 0 of 3 gates open',tag:['n','new hint']},
 {img:'portrait/x.jpg',t:'3 · X, the Hollow',n:'The arena fight, as it is: the rake arms, the stage, the wall behind.',
  hearts:3,max:3,light:2.2,dash:[1,0.5],boss:['X, the Hollow',7,9,'#ff3a4a'],cap:['there you are.','world',true],tag:['g','game line']},
 {img:'portrait/archive.jpg',t:'4 · The Collector',n:'His wing: drawers, jars, labels on strings. A drawer monster has just come out.',
  hearts:2,lost:1,max:3,light:0.6,dash:[1,1],boss:['The Collector',5,8,'#ffcf5a'],cap:['look. all my little friends.','world',true],tag:['g','game line']},
 {img:'portrait/chase.jpg',t:'5 · the long span',n:'The camera swings round to show the hound on your heels. Keep moving.',
  hearts:3,max:3,light:1,dash:[1,0],goal:'find mother and father · 2 of 3 gates open',cap:['something warm is behind you. do not stop.','world',false],tag:['n','new line']},
 {img:'portrait/remix.jpg',t:'6 · The Mash',n:'The guardians stitched together, in the arena as it is: pink and teal, petals, a scorpion tail.',
  hearts:3,max:3,light:1.4,dash:[1,1],boss:['The Mash',6,9,'#ff8aa8'],cap:['we were guarding you.','world',true],tag:['g','game line']},
 {img:'portrait/hearth.jpg',t:'7 · a hearth',n:'Lantern light the Cinderfox will not enter. Rest, heal, plan the run.',
  hearts:3,max:3,light:2,dash:[1,1],goal:'find mother and father · 2 of 3 gates open',cap:['It will not come into the light.','thought',false],tag:['n','new line']},
 {img:'portrait/summit.jpg',t:'8 · the ledge',n:'Mother and her bow, high on the wall, and the Blob on the ledge below her.',
  hearts:3,max:3,light:0,dash:[1,1],cap:['Up on the wall, two yellow smudges. I know them.','thought',true],tag:['g','game line']},
];
let out='';
FR.forEach((f,i)=>{
  const col=i%4,row=Math.floor(i/4);
  const left=55+col*430,top=150+row*830;
  let h=`<div class="stage" style="--u:4px"><img class="shot" src="${f.img}">`;
  h+=`<div class="hearts show">${Array.from({length:f.max},(_,k)=>heart.replace('class="heart"',`class="heart${k>=f.max-(f.lost||0)?' lost':''}"`)).join('')}</div>`;
  if(f.light!==undefined && f.light!==null){
    h+=`<div class="lightmeter show${f.light>=3?' ready':''}">${[0,1,2].map(k=>{const v=Math.max(0,Math.min(1,f.light-k));return `<i style="--f:${v}" class="${v>=1?'full':''}"></i>`}).join('')}</div>`;
    h+=`<div class="dashmeter show">${f.dash.map(v=>`<i style="--f:${v}" class="${v>=1?'full':''}"></i>`).join('')}</div>`;
  }
  if(f.boss){const [nm,hp,mx,c]=f.boss;h+=`<div class="bossbar show" style="--bc:${c}"><div class="bn">${nm}</div><div class="bp">${Array.from({length:mx},(_,k)=>`<i class="${k>=hp?'off':''}"></i>`).join('')}</div></div>`}
  if(f.goal)h+=`<div class="goal show">${f.goal}</div>`;
  if(f.zone)h+=`<div class="zonecard" style="opacity:1;animation:none"><b>${f.zone[0]}</b><i>${f.zone[1]}</i></div>`;
  if(f.hint)h+=`<div class="hint show">${f.hint}</div>`;
  if(f.cap)h+=`<div class="caption show tone-${f.cap[1]}${f.cap[2]?' low':''}">${f.cap[0]}</div>`;
  h+='</div>';
  out+=`<div class="ph2" style="left:${left}px;top:${top}px">${h}<div class="pc"><b>${f.t}</b>${f.n}<br><span class="tag ${f.tag[0]}">${f.tag[1]}</span></div></div>`;
});
document.getElementById('grid').innerHTML=out;
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{window.__done=true});
</script>
</div></body></html>
