<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Third Direction: brand art</title>
<!--
  The logo, the store cover and the icon, drawn on a canvas. tools/brand/render.mjs opens this page once per piece
  (#logo, #cover, #icon, #banner) and saves the canvas as a PNG into brand/. Fonts are the OFL files in fonts/.
-->
<style>
  @font-face { font-family: 'Boldonse'; src: url(fonts/Boldonse-Regular.ttf); }
  @font-face { font-family: 'Big Shoulders'; src: url(fonts/BigShoulders-Bold.ttf); font-weight: 700; }
  html, body { margin: 0; background: #222; }
  canvas { display: block; }
</style>
</head>
<body>
<script>
const GOLD = ['#fff3c4', '#f7d56e', '#e9a93a'];
const CREAM = '#efe6d2';
const TEAL = '#5fd6d0';
const INK = '#05060c';

function load(src) {
  const im = new Image();
  im.src = src;
  return im.decode().then(() => im);
}

/** the mark: a baby blob at the corner of three axes; two lie flat (teal), the third goes up (gold) */
function emblem(g, cx, cy, s, opts = {}) {
  const iso = Math.PI / 6;
  const flat = s * 1.05;
  g.save();
  g.lineCap = 'round';
  // the two flat directions
  for (const dir of [-1, 1]) {
    const ex = cx + dir * Math.cos(iso) * flat, ey = cy + Math.sin(iso) * flat;
    const gr = g.createLinearGradient(cx, cy, ex, ey);
    gr.addColorStop(0, 'rgba(95,214,208,0.95)');
    gr.addColorStop(1, 'rgba(95,214,208,0)');
    g.strokeStyle = gr;
    g.lineWidth = s * 0.07;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
  }
  // the third: up, glowing
  const top = cy - s * 1.55;
  g.shadowColor = 'rgba(247,213,110,0.55)';
  g.shadowBlur = s * 0.18;
  const up = g.createLinearGradient(cx, cy, cx, top);
  up.addColorStop(0, GOLD[2]); up.addColorStop(1, GOLD[0]);
  g.strokeStyle = up;
  g.fillStyle = GOLD[0];
  g.lineWidth = s * 0.11;
  g.beginPath(); g.moveTo(cx, cy - s * 0.2); g.lineTo(cx, top + s * 0.22); g.stroke();
  const ah = s * 0.3;
  g.beginPath(); g.moveTo(cx, top); g.lineTo(cx - ah * 0.72, top + ah); g.lineTo(cx + ah * 0.72, top + ah); g.closePath(); g.fill();
  g.shadowBlur = 0;
  // the blob, sitting on the corner and looking up
  const bw = s * 0.5, bh = s * 0.42;
  const by = cy + s * 0.08;
  g.shadowColor = 'rgba(247,213,110,0.5)';
  g.shadowBlur = s * 0.22;
  const body = g.createRadialGradient(cx - bw * 0.3, by - bh * 0.8, bw * 0.1, cx, by - bh * 0.4, bw * 1.1);
  body.addColorStop(0, '#fff6cf'); body.addColorStop(0.45, '#f9cf5c'); body.addColorStop(1, '#e48a2c');
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(cx - bw, by);
  g.bezierCurveTo(cx - bw, by - bh * 1.35, cx + bw, by - bh * 1.35, cx + bw, by);
  g.quadraticCurveTo(cx, by + bh * 0.16, cx - bw, by);
  g.fill();
  g.shadowBlur = 0;
  // eyes, looking up
  g.fillStyle = '#2a1408';
  for (const dx of [-0.32, 0.32]) {
    g.beginPath(); g.ellipse(cx + dx * bw, by - bh * 0.6, bw * 0.11, bh * 0.2, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cx + dx * bw + bw * 0.02, by - bh * 0.72, bw * 0.045, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2a1408';
  }
  g.restore();
}

/** the word THIRD: a gold face with its depth rising up and back, the way the world does in the game */
function third(g, cx, baseline, size) {
  g.save();
  g.font = `${size}px Boldonse`;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  g.letterSpacing = `${size * 0.02}px`;
  const depth = Math.round(size * 0.13);
  for (let i = depth; i >= 1; i--) {
    const k = i / depth;
    g.fillStyle = `rgb(${Math.round(40 + 30 * (1 - k))},${Math.round(22 + 40 * (1 - k))},${Math.round(70 + 40 * (1 - k))})`;
    g.fillText('THIRD', cx + i * 0.55, baseline - i);
  }
  // a thin teal rim where the depth meets the face
  g.fillStyle = TEAL;
  g.fillText('THIRD', cx + 1.5, baseline - 2.5);
  const face = g.createLinearGradient(0, baseline - size * 0.95, 0, baseline);
  face.addColorStop(0, GOLD[0]); face.addColorStop(0.5, GOLD[1]); face.addColorStop(1, GOLD[2]);
  g.fillStyle = face;
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = size * 0.08;
  g.shadowOffsetY = size * 0.03;
  g.fillText('THIRD', cx, baseline);
  g.restore();
  g.font = `${size}px Boldonse`;
  g.letterSpacing = `${size * 0.02}px`;
  return g.measureText('THIRD').width;
}

function spaced(g, text, cx, baseline, size, spacing, color) {
  g.save();
  g.font = `700 ${size}px 'Big Shoulders'`;
  g.letterSpacing = `${spacing}px`;
  g.textAlign = 'center';
  g.fillStyle = color;
  g.shadowColor = 'rgba(0,0,0,0.6)';
  g.shadowBlur = size * 0.25;
  // letterSpacing adds space after the last letter too; shift by half of it to stay centred
  g.fillText(text, cx + spacing / 2, baseline);
  const w = g.measureText(text).width - spacing;
  g.restore();
  return w;
}

/** the whole logo, centred on cx; `w` is the width of THIRD. Returns the bottom. */
function logo(g, cx, top, w, opts = {}) {
  g.font = `100px Boldonse`;
  g.letterSpacing = '2px';
  const size = (w / g.measureText('THIRD').width) * 100;
  g.font = `${size}px Boldonse`;
  const cap = g.measureText('THIRD').actualBoundingBoxAscent;
  const depth = Math.round(size * 0.13);
  let y = top;
  if (opts.emblem !== false) {
    const s = size * 0.5;
    emblem(g, cx, y + s * 1.62, s);
    y += s * 2.05;
  }
  const ts = size * 0.36;
  spaced(g, 'THE', cx, y + ts * 0.72, ts, ts * 0.9, CREAM);
  y += ts * 0.72 + size * 0.1;
  third(g, cx, y + depth + cap, size);
  y += depth + cap + size * 0.2;
  const ds = size * 0.36;
  const dw = spaced(g, 'DIRECTION', cx, y + ds * 0.72, ds, ds * 0.42, CREAM);
  // fine rules either side of DIRECTION
  const ry = y + ds * 0.36;
  g.save();
  g.strokeStyle = 'rgba(95,214,208,0.8)';
  g.lineWidth = Math.max(1.5, size * 0.02);
  for (const dir of [-1, 1]) {
    const x0 = cx + dir * (dw / 2 + ds * 0.45);
    const x1 = cx + dir * (w / 2 + size * 0.05);
    if (Math.abs(x1 - cx) > Math.abs(x0 - cx) + 4) { g.beginPath(); g.moveTo(x0, ry); g.lineTo(x1, ry); g.stroke(); }
  }
  g.restore();
  return y + ds;
}

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  document.body.appendChild(c);
  return [c, c.getContext('2d')];
}

/** draw an image to cover the box (x, y, w, h), with its focus point (fx, fy as 0..1 of the image) placed at (px, py) of the box */
function cover(g, im, x, y, w, h, scale, fx, fy, px, py) {
  const s = scale;
  const dw = im.width * s, dh = im.height * s;
  let dx = x + px * w - fx * dw, dy = y + py * h - fy * dh;
  dx = Math.min(x, Math.max(x + w - dw, dx));
  dy = Math.min(y, Math.max(y + h - dh, dy));
  g.drawImage(im, dx, dy, dw, dh);
}

function dust(g, w, h, n, seed) {
  let r = seed;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h, s = 1 + rnd() * 2.5;
    g.fillStyle = `rgba(${rnd() < 0.5 ? '247,213,110' : '150,240,230'},${0.25 + rnd() * 0.5})`;
    g.fillRect(x, y, s, s);
  }
}

/** the logo's picture (see PIECES.logo), drawn into g; returns the bottom of the title */
async function crest(g, W, family, layers = { glow: true, art: true }) {
    const cx = W / 2, H = 1900;
    const names = ['gloommother', 'king', 'queen', 'wyrm', 'mimic', 'collector', 'mash', 'blob', 'mother', 'father'];
    const S = Object.fromEntries(await Promise.all(names.map(async (n) => [n, await load(`sprites/${n}.png`)])));
    if (layers.glow) {
    // a night glow that fades to nothing at the edges
    const night = g.createRadialGradient(cx, 760, 80, cx, 820, 1150);
    night.addColorStop(0, 'rgba(22,52,74,0.85)');
    night.addColorStop(0.55, 'rgba(10,20,38,0.55)');
    night.addColorStop(1, 'rgba(5,6,12,0)');
    g.fillStyle = night;
    g.fillRect(0, 0, W, H);
    // the moon, low behind the Mash
    const moon = g.createRadialGradient(cx, 500, 0, cx, 500, 380);
    moon.addColorStop(0, 'rgba(210,250,255,0.55)');
    moon.addColorStop(0.45, 'rgba(120,220,230,0.22)');
    moon.addColorStop(1, 'rgba(120,220,230,0)');
    g.fillStyle = moon;
    g.fillRect(cx - 400, 70, 800, 800);
    }
    if (layers.art) {
    dust(g, W, H * 0.8, 160, 5);
    xEyes(g, cx, 140, 6);
    // the bosses, back to front: outer ones lower and darker, the Mash in the middle
    const row = [
      { n: 'wyrm', x: 230, y: 1010, k: 3, rim: 'rgba(244,239,224,0.55)', dark: 0.55 },
      { n: 'king', x: 2170, y: 1010, k: 3, rim: 'rgba(224,160,96,0.6)', dark: 0.55, flip: true },
      { n: 'gloommother', x: 520, y: 900, k: 3, rim: 'rgba(111,240,255,0.7)', dark: 0.5 },
      { n: 'mimic', x: 1890, y: 900, k: 3, rim: 'rgba(255,138,168,0.65)', dark: 0.5 },
      { n: 'queen', x: 820, y: 790, k: 3, rim: 'rgba(217,184,255,0.7)', dark: 0.45 },
      { n: 'collector', x: 1590, y: 790, k: 3, rim: 'rgba(247,213,110,0.55)', dark: 0.45 },
      { n: 'mash', x: cx, y: 745, k: 3, rim: 'rgba(255,90,120,0.6)', dark: 0.4 },
    ];
    for (const b of row) {
      const { c: s, pad } = receded(S[b.n], b.k, b);
      g.drawImage(s, b.x - s.width / 2, b.y - s.height + pad);
    }
    }
    if (layers.glow) {
    // a dark band so the words read over the crowd
    // (drawn squashed to an ellipse: the gradient lives in the squashed space, centred where 1100 ends up)
    const band = g.createRadialGradient(cx, 1100 / 0.45, 60, cx, 1100 / 0.45, 900);
    band.addColorStop(0, 'rgba(5,6,12,0.82)');
    band.addColorStop(0.6, 'rgba(5,6,12,0.5)');
    band.addColorStop(1, 'rgba(5,6,12,0)');
    g.save();
    g.scale(1, 0.45);
    g.fillStyle = band;
    g.fillRect(0, 1100 / 0.45 - 900, W, 1800);
    g.restore();
    }
    // (the title is drawn either way: the bottom is where it ends; with no art it is drawn and wiped)
    g.save();
    if (!layers.art) g.globalAlpha = 0;
    const bottom = logo(g, cx, 800, 1150, { emblem: false });
    g.restore();
    // the family in front: the little one looking up, Mother (the bow) and Father a step behind
    const fam = (n, x, y, k, a) => {
      const s = sprite(S[n], k);
      g.globalAlpha = a;
      g.drawImage(s, x - s.width / 2, y - s.height);
      g.globalAlpha = 1;
    };
    if (!family) return bottom;
    const fy = bottom + 250;
    const glow = g.createRadialGradient(cx, fy - 60, 10, cx, fy - 60, 320);
    glow.addColorStop(0, 'rgba(247,213,110,0.5)');
    glow.addColorStop(1, 'rgba(247,213,110,0)');
    g.fillStyle = glow;
    g.fillRect(cx - 330, fy - 390, 660, 660);
    fam('mother', cx - 250, fy - 14, 6, 0.92);
    fam('father', cx + 260, fy - 14, 6, 0.92);
    g.shadowColor = 'rgba(247,213,110,0.9)';
    g.shadowBlur = 50;
    fam('blob', cx, fy, 7, 1);
    g.shadowBlur = 0;
    return bottom;
}

/** a sprite from sprites/ (tools/brand/sprites.mjs), at a whole-number zoom so its pixels stay square and sharp */
function sprite(im, k, flip = false) {
  const c = document.createElement('canvas');
  c.width = im.width * k;
  c.height = im.height * k;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  if (flip) { g.translate(c.width, 0); g.scale(-1, 1); }
  g.drawImage(im, 0, 0, c.width, c.height);
  return c;
}

/** push a boss back into the night: darker toward its feet, a rim of its own colour around it */
function receded(im, k, o) {
  const s = sprite(im, k, o.flip);
  const pad = 60;
  const c = document.createElement('canvas');
  c.width = s.width + pad * 2;
  c.height = s.height + pad * 2;
  const g = c.getContext('2d');
  g.shadowColor = o.rim;
  g.shadowBlur = 36;
  g.drawImage(s, pad, pad);
  g.shadowBlur = 0;
  g.globalCompositeOperation = 'source-atop';
  const dk = g.createLinearGradient(0, pad, 0, pad + s.height);
  dk.addColorStop(0, `rgba(6,8,22,${o.dark * 0.35})`);
  dk.addColorStop(1, `rgba(6,8,22,${o.dark})`);
  g.fillStyle = dk;
  g.fillRect(0, 0, c.width, c.height);
  return { c, pad };
}

/** X, the Hollow: three eyes open in the dark above everything, drawn as pixel art like his fight at the Edge */
function xEyes(g, cx, cy, k) {
  const w = 120, h = 30;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const p = c.getContext('2d');
  const ell = (x, y, rx, ry, col) => {
    p.fillStyle = col;
    for (let yy = Math.floor(y - ry); yy <= Math.ceil(y + ry); yy++) {
      const t = (yy - y) / ry;
      if (Math.abs(t) > 1) continue;
      const hw = rx * Math.sqrt(1 - t * t);
      p.fillRect(Math.round(x - hw), yy, Math.round(hw * 2), 1);
    }
  };
  [[20, 17], [60, 13], [100, 17]].forEach(([x, y], i) => {
    ell(x, y, 17, 9, '#1a0610');
    ell(x, y, 15, 7.5, '#d9e4ff');
    ell(x + (i - 1) * 1.5, y + 1, 6.5, 6.5, '#e8343f');
    ell(x + (i - 1) * 1.5, y + 1, 2, 5.5, '#05060c');
    p.fillStyle = '#fff';
    p.fillRect(Math.round(x + (i - 1) * 1.5 + 2), y - 2, 1, 1);
  });
  g.save();
  // the red haze they cast
  const haze = g.createRadialGradient(cx, cy, 10, cx, cy, w * k * 0.62);
  haze.addColorStop(0, 'rgba(232,52,63,0.32)');
  haze.addColorStop(1, 'rgba(232,52,63,0)');
  g.fillStyle = haze;
  g.fillRect(cx - w * k, cy - h * k * 3, w * k * 2, h * k * 6);
  g.imageSmoothingEnabled = false;
  g.shadowColor = 'rgba(255,60,70,0.9)';
  g.shadowBlur = 40;
  g.drawImage(c, cx - (w * k) / 2, cy - (h * k) / 2, w * k, h * k);
  g.restore();
}

const PIECES = {
  /**
   * The logo: the title in front of every boss in the game. X's three eyes open above, the seven others stand in an arc
   * behind the words (2D pixel art, the 3D ones drawn small to match), and the blob family waits in front, looking up.
   * The background is transparent: only soft glows, so it sits on any colour.
   */
  async logo() {
    const W = 2400, H = 1900;
    const [c, g] = canvas(W, H);
    await crest(g, W, true);
    return c;
  },
  /**
   * The logo for the game's own title screens (src/assets/crest.webp): the same picture without the family, who are already
   * standing in the scene under it, cut off just under the title.
   */
  async crest() {
    // the glows go on first and fade out before the cut, so the picture has no hard bottom edge
    const [glow, gg] = canvas(2400, 1900);
    const bottom = await crest(gg, 2400, false, { glow: true, art: false });
    const H = Math.ceil(bottom + 70);
    gg.globalCompositeOperation = 'destination-in';
    const fade = gg.createLinearGradient(0, H - 380, 0, H);
    fade.addColorStop(0, 'rgba(0,0,0,1)');
    fade.addColorStop(1, 'rgba(0,0,0,0)');
    gg.fillStyle = fade;
    gg.fillRect(0, 0, 2400, H - 380);
    gg.fillRect(0, H - 380, 2400, 380);
    gg.clearRect(0, H, 2400, 1900);
    const [art, ga] = canvas(2400, 1900);
    await crest(ga, 2400, false, { glow: false, art: true });
    const [c, g] = canvas(2400, H);
    g.drawImage(glow, 0, 0);
    g.drawImage(art, 0, 0);
    glow.remove();
    art.remove();
    return c;
  },
  /** the title alone with its mark (for small sizes, where the full logo gets busy) */
  async wordmark() {
    const [c, g] = canvas(1600, 1300);
    logo(g, 800, 50, 1200);
    return c;
  },
  async icon() {
    const [c, g] = canvas(1080, 1080);
    const bg = g.createRadialGradient(540, 620, 50, 540, 560, 760);
    bg.addColorStop(0, '#16304a'); bg.addColorStop(0.55, '#0a1424'); bg.addColorStop(1, INK);
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
    dust(g, 1080, 1080, 140, 7);
    emblem(g, 540, 700, 330);
    return c;
  },
  async cover() {
    // itch.io cover: 630 x 500, made at twice that
    const W = 1260, H = 1000;
    const [c, g] = canvas(W, H);
    const [flat, deep] = await Promise.all([load('img/flat.jpg'), load('img/deep.jpg')]);
    // the seam: a tear from top to bottom, leaning right
    const seam = (y) => 600 + (y / H) * 70;
    // right: the deep world (X over the blob)
    g.fillStyle = INK; g.fillRect(0, 0, W, H);
    cover(g, deep, 560, 0, W - 560, H, 0.66, 0.5, 0.36, 0.5, 0.42);
    // left: the flat world, clipped to the tear
    g.save();
    g.beginPath(); g.moveTo(0, 0); g.lineTo(seam(0), 0);
    for (let y = 0; y <= H; y += 25) g.lineTo(seam(y) + (y % 50 ? 9 : -9), y);
    g.lineTo(0, H); g.closePath(); g.clip();
    cover(g, flat, 0, 0, W, H, 0.72, 0.5, 0.18, 0.25, 0.22);
    // darken the lower flat world so the title reads
    const dk = g.createLinearGradient(0, H * 0.3, 0, H);
    dk.addColorStop(0, 'rgba(5,6,12,0)'); dk.addColorStop(0.45, 'rgba(5,6,12,0.75)'); dk.addColorStop(1, 'rgba(5,6,12,0.92)');
    g.fillStyle = dk; g.fillRect(0, 0, W, H);
    g.restore();
    // the tear glows gold
    g.save();
    g.shadowColor = 'rgba(247,213,110,1)';
    g.shadowBlur = 30;
    g.strokeStyle = '#ffe9a6';
    g.lineWidth = 4;
    g.beginPath(); g.moveTo(seam(0), 0);
    for (let y = 0; y <= H; y += 25) g.lineTo(seam(y) + (y % 50 ? 9 : -9), y);
    g.stroke();
    g.restore();
    // a vignette over everything
    const vg = g.createRadialGradient(W * 0.5, H * 0.5, H * 0.35, W * 0.5, H * 0.5, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    dust(g, W, H, 90, 3);
    logo(g, 315, 560, 500, { emblem: false });
    return c;
  },
  async banner() {
    // itch.io page banner (960 wide), made at twice that
    const W = 1920, H = 640;
    const [c, g] = canvas(W, H);
    const deep = await load('img/deep.jpg');
    g.fillStyle = INK; g.fillRect(0, 0, W, H);
    cover(g, deep, 800, 0, W - 800, H, 1.04, 0.5, 0.2, 0.5, 0.48);
    const fade = g.createLinearGradient(820, 0, 1300, 0);
    fade.addColorStop(0, INK); fade.addColorStop(1, 'rgba(5,6,12,0)');
    g.fillStyle = fade; g.fillRect(780, 0, 520, H);
    dust(g, W, H, 120, 11);
    logo(g, W * 0.27, 70, 640, { emblem: false });
    return c;
  },

  /**
   * The itch.io page background (2560 x 2160, itch.io's tallest). itch.io shows it at its real size, centred at the top
   * behind a 960 px page column, so on most screens only a strip of 250 to 480 px shows on each side. Everything that
   * matters sits in those strips, close to the column: a bestiary of the five 2D guardians down the left, windows into the
   * 3D world with X, the Collector and the Mash down the right, gold seams along the column's edges, X's eyes on top.
   */
  async itchbg() {
    const W = 2560, H = 2160, cx = W / 2;
    const L = cx - 480, R = cx + 480;
    const [c, g] = canvas(W, H);
    const [flat, deep, x3d, col3d, mash3d] = await Promise.all(['flat', 'deep', 'x3d', 'collector3d', 'mash3d'].map((n) => load(`img/${n}.jpg`)));
    const S = Object.fromEntries(await Promise.all(['gloommother', 'king', 'queen', 'wyrm', 'mimic', 'blob', 'mother', 'father'].map(async (n) => [n, await load(`sprites/${n}.png`)])));
    nightSky(g, W, H, 21);
    // faint worlds behind each strip
    g.globalAlpha = 0.45;
    sideWorld(g, flat, L - 170, 0, 760, H, 1.15, 0.5, 0.45, 'left');
    sideWorld(g, deep, R + 170, 0, 760, H, 1.15, 0.5, 0.45, 'right');
    g.globalAlpha = 1;
    for (const x of [L - 8, R + 8]) tear(g, x, H, x < cx ? 7 : 13);
    // left: the flat world's guardians, one under another, each named
    const sx = L - 165;
    const guardians = [
      ['gloommother', 'GLOOMMOTHER', 'rgba(111,240,255,0.8)', '#6ff0ff'],
      ['king', 'THORNBACK KING', 'rgba(224,160,96,0.75)', '#e8b27a'],
      ['queen', 'TOLL QUEEN', 'rgba(217,184,255,0.8)', '#d9b8ff'],
      ['wyrm', 'BONE WYRM', 'rgba(244,239,224,0.6)', '#f4efe0'],
      ['mimic', 'MIMIC QUEEN', 'rgba(255,138,168,0.75)', '#ff8aa8'],
    ];
    guardians.forEach(([n, name, rim, ink], i) => {
      const foot = 420 + i * 360;
      const im = S[n];
      const { c: sp, pad } = receded(im, 2, { rim, dark: 0.12, flip: n === 'king' });
      const pool = g.createRadialGradient(sx, foot, 4, sx, foot, 170);
      pool.addColorStop(0, rim.replace(/[\d.]+\)$/, '0.22)')); pool.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = pool; g.fillRect(sx - 180, foot - 180, 360, 360);
      g.drawImage(sp, sx - sp.width / 2, foot - sp.height + pad);
      label(g, name, sx, foot + 46, ink);
    });
    // right: windows into the 3D world
    const rx = R + 165;
    const wins = [
      [x3d, 0.47, 0.47, 1.6, 'X, THE HOLLOW', '#ff6b74'],
      [col3d, 0.47, 0.6, 1.6, 'THE COLLECTOR', '#f7d56e'],
      [mash3d, 0.5, 0.58, 1.5, 'THE MASH', '#ff8aa8'],
    ];
    wins.forEach(([im, fx, fy, zoom, name, ink], i) => {
      const top = 250 + i * 620;
      archWindow(g, im, rx, top, 280, 440, fx, fy, zoom);
      label(g, name, rx, top + 500, ink);
    });
    // the family, at the bottom of the left strip, looking up at it all
    const fam = (n, x, y, k) => { const s = sprite(S[n], k); g.drawImage(s, x - s.width / 2, y - s.height); };
    const fy = 2120;
    const gl = g.createRadialGradient(sx, fy - 30, 4, sx, fy - 30, 150);
    gl.addColorStop(0, 'rgba(247,213,110,0.4)'); gl.addColorStop(1, 'rgba(247,213,110,0)');
    g.fillStyle = gl; g.fillRect(sx - 160, fy - 180, 320, 330);
    fam('mother', sx - 112, fy - 6, 3); fam('father', sx + 116, fy - 6, 3);
    g.shadowColor = 'rgba(247,213,110,0.9)'; g.shadowBlur = 24; fam('blob', sx, fy, 4); g.shadowBlur = 0;
    xEyes(g, cx, 66, 3);
    fireflies(g, W, H, 200, 4);
    finish(g, W, H);
    return c;
  },

  /**
   * The itch.io embed background (behind the "Run game" button), 2x the 390 x 844 game frame (itch.io's limit is 3840 x 2160). The 3D world above, the
   * flat forest below, the gold tear between them right where the button sits, and the title at the top.
   */
  async itchembed() {
    const W = 1170, H = 2532, cx = W / 2;
    const [c, g] = canvas(W, H);
    const [flat, deep] = await Promise.all([load('img/flat.jpg'), load('img/deep.jpg')]);
    nightSky(g, W, H, 9);
    const seam = H * 0.5;
    // above: the deep world, X looking down at the blob
    g.save();
    g.beginPath(); g.rect(0, 0, W, seam); g.clip();
    // (placed by hand, lower than the picture's own top, so X stands below the title; its top edge melts into the sky)
    const dw = deep.width * 1.12, dh = deep.height * 1.12, dy = 380;
    g.drawImage(deep, cx - dw / 2, dy, dw, dh);
    const top = g.createLinearGradient(0, dy, 0, dy + 360);
    top.addColorStop(0, 'rgba(8,15,28,1)'); top.addColorStop(1, 'rgba(8,15,28,0)');
    g.fillStyle = top; g.fillRect(0, 0, W, dy + 360);
    g.fillStyle = 'rgba(8,15,28,1)'; g.fillRect(0, 0, W, dy);
    dust(g, W, dy + 200, 90, 4);
    g.restore();
    // below: the flat forest, the Gloommother and the little blob
    g.save();
    g.beginPath(); g.rect(0, seam, W, H - seam); g.clip();
    cover(g, flat, 0, seam, W, H - seam, 1.1, 0.5, 0.3, 0.5, 0.42);
    const bot = g.createLinearGradient(0, H * 0.8, 0, H);
    bot.addColorStop(0, 'rgba(5,6,12,0)'); bot.addColorStop(1, 'rgba(5,6,12,0.95)');
    g.fillStyle = bot; g.fillRect(0, seam, W, H - seam);
    g.restore();
    // the tear across the middle, with a soft gold halo where the Run button sits
    const halo = g.createRadialGradient(cx, seam, 10, cx, seam, 520);
    halo.addColorStop(0, 'rgba(247,213,110,0.38)'); halo.addColorStop(1, 'rgba(247,213,110,0)');
    g.fillStyle = halo; g.fillRect(0, seam - 520, W, 1040);
    g.save();
    g.shadowColor = 'rgba(247,213,110,1)'; g.shadowBlur = 40;
    g.strokeStyle = '#ffe9a6'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, seam);
    for (let x = 0; x <= W; x += 30) g.lineTo(x, seam + ((x / 30) % 2 ? 11 : -11));
    g.stroke(); g.stroke();
    g.restore();
    logo(g, cx, 70, 600, { emblem: false });
    // a quiet line at the bottom
    g.save();
    g.font = "700 40px 'Big Shoulders'"; g.letterSpacing = '12px'; g.textAlign = 'center';
    g.fillStyle = 'rgba(239,230,210,0.85)';
    g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 12;
    g.fillText('BEST WITH SOUND ON', cx + 6, H - 110);
    g.restore();
    fireflies(g, W, H, 70, 2);
    finish(g, W, H);
    // itch.io takes images up to 3840 x 2160: hand it two times the frame (780 x 1688), drawn at three and scaled down
    const out = document.createElement('canvas');
    out.width = 780; out.height = 1688;
    const o = out.getContext('2d');
    o.imageSmoothingQuality = 'high';
    o.drawImage(c, 0, 0, 780, 1688);
    return out;
  },
};

/** the game's night: deep blue at the top to ink at the bottom, with stars */
function nightSky(g, W, H, seed) {
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d1b2c'); bg.addColorStop(0.5, '#080f1c'); bg.addColorStop(1, INK);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  dust(g, W, H, Math.round((W * H) / 9000), seed);
}

/** one of the two worlds beside the page column: the picture fades out toward the middle and toward the outer edge */
function sideWorld(g, im, cxSide, y, w, h, scale, fx, fy, side) {
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const o = off.getContext('2d');
  const dw = im.width * scale, dh = im.height * scale;
  o.drawImage(im, w * 0.5 - fx * dw, h * 0.5 - fy * dh, dw, dh);
  // fade it out in a soft oval, so no edge of the picture shows
  o.globalCompositeOperation = 'destination-in';
  o.save();
  o.translate(w / 2, h * 0.5);
  o.scale(w / 2, h / 2);
  const m = o.createRadialGradient(0, 0, 0, 0, 0, 1);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.5, 'rgba(0,0,0,0.95)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  o.fillStyle = m; o.fillRect(-1, -1, 2, 2);
  o.restore();
  g.drawImage(off, cxSide - w / 2, y);
}

/** a name under a boss, small and spaced, in its own colour */
function label(g, text, x, y, ink) {
  g.save();
  g.font = "700 30px 'Big Shoulders'";
  g.letterSpacing = '7px';
  g.textAlign = 'center';
  g.fillStyle = ink;
  g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 10;
  g.fillText(text, x + 3.5, y);
  g.restore();
}

/** a game picture seen through an arched window with a thin gold rim and a soft glow */
function archWindow(g, im, cx, top, w, h, fx, fy, zoom) {
  const x = cx - w / 2, r = w / 2;
  const path = () => {
    g.beginPath();
    g.moveTo(x, top + h);
    g.lineTo(x, top + r);
    g.arc(cx, top + r, r, Math.PI, 0);
    g.lineTo(x + w, top + h);
    g.closePath();
  };
  g.save();
  g.shadowColor = 'rgba(247,213,110,0.45)'; g.shadowBlur = 50;
  path(); g.fillStyle = INK; g.fill();
  g.restore();
  g.save();
  path(); g.clip();
  // the picture `zoom` times the window's width, its focus point (fx, fy) in the window's middle
  const dw = w * zoom, dh = dw * (im.height / im.width);
  g.drawImage(im, cx - fx * dw, top + h * 0.5 - fy * dh, dw, dh);
  const fade = g.createLinearGradient(0, top + h * 0.7, 0, top + h);
  fade.addColorStop(0, 'rgba(5,6,12,0)'); fade.addColorStop(1, 'rgba(5,6,12,0.85)');
  g.fillStyle = fade; g.fillRect(x, top, w, h);
  g.restore();
  path(); g.strokeStyle = 'rgba(247,213,110,0.85)'; g.lineWidth = 3; g.stroke();
}

/** a jagged seam of gold light, top to bottom */
function tear(g, x, H, seed) {
  g.save();
  const fade = g.createLinearGradient(0, 0, 0, H);
  fade.addColorStop(0, 'rgba(255,233,166,0)'); fade.addColorStop(0.2, 'rgba(255,233,166,0.75)');
  fade.addColorStop(0.75, 'rgba(255,233,166,0.75)'); fade.addColorStop(1, 'rgba(255,233,166,0)');
  g.strokeStyle = fade;
  g.shadowColor = 'rgba(247,213,110,0.9)'; g.shadowBlur = 28;
  g.lineWidth = 3;
  let r = seed;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  g.beginPath(); g.moveTo(x, 0);
  for (let y = 0; y <= H; y += 22) g.lineTo(x + (rnd() - 0.5) * 18, y);
  g.stroke();
  g.restore();
}

/** a boss sprite in the dark at the screen's far edge */
function edgeBoss(g, im, x, y, k, rim) {
  const { c, pad } = receded(im, k, { rim, dark: 0.55 });
  g.save();
  g.globalAlpha = 0.85;
  g.drawImage(c, x - c.width / 2, y - c.height + pad);
  g.restore();
}

/** gold and teal motes drifting in the dark, some soft and big */
function fireflies(g, W, H, n, seed) {
  let r = seed * 7919;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  g.save();
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, s = 2 + rnd() * 5, gold = rnd() < 0.7;
    g.shadowColor = gold ? 'rgba(247,213,110,0.9)' : 'rgba(111,240,255,0.9)';
    g.shadowBlur = s * 4;
    g.fillStyle = gold ? `rgba(255,233,166,${0.35 + rnd() * 0.5})` : `rgba(160,245,240,${0.3 + rnd() * 0.4})`;
    g.beginPath(); g.arc(x, y, s / 2, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

/** the last pass: a vignette and a fine film grain */
function finish(g, W, H) {
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const im = g.getImageData(0, 0, W, H);
  let r = 12345;
  for (let i = 0; i < im.data.length; i += 4) {
    r = (r * 16807) % 2147483647;
    const n = ((r / 2147483647) - 0.5) * 10;
    im.data[i] += n; im.data[i + 1] += n; im.data[i + 2] += n;
  }
  g.putImageData(im, 0, 0);
}

/**
 * A store screenshot with a hook line: the game's own picture (1080 x 1920), a little smaller, in a frame, with the line above it.
 * `words` is the line; the word in [brackets] is drawn in gold. Used by tools/screens/frame.mjs.
 */
async function framed(src, words, tag) {
  const W = 1080, H = 1920;
  const [c, g] = canvas(W, H);
  const im = await load(src);
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1626'); bg.addColorStop(1, INK);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  dust(g, W, 300, 60, words.length);
  // the line: one or two rows, the bracketed word gold
  const size = 92;
  g.font = `700 ${size}px 'Big Shoulders'`;
  g.letterSpacing = '3px';
  g.textBaseline = 'alphabetic';
  const rows = words.split('\n');
  rows.forEach((row, ri) => {
    const parts = row.split(/(\[[^\]]+\])/).filter(Boolean);
    const widths = parts.map((p) => g.measureText(p.replace(/[\[\]]/g, '')).width);
    let x = W / 2 - widths.reduce((a, b) => a + b, 0) / 2;
    const y = (rows.length === 1 ? 190 : 140) + ri * size * 0.98;
    parts.forEach((p, i) => {
      const gold = p.startsWith('[');
      g.fillStyle = gold ? GOLD[1] : CREAM;
      g.shadowColor = gold ? 'rgba(247,213,110,0.45)' : 'rgba(0,0,0,0.6)';
      g.shadowBlur = gold ? 24 : 10;
      g.fillText(p.replace(/[\[\]]/g, ''), x, y);
      x += widths[i];
    });
  });
  g.shadowBlur = 0;
  if (tag) {
    g.font = `700 30px 'Big Shoulders'`;
    g.letterSpacing = '9px';
    g.fillStyle = TEAL;
    g.textAlign = 'center';
    g.fillText(tag, W / 2 + 4.5, rows.length === 1 ? 262 : 300);
    g.textAlign = 'left';
  }
  // the picture, in a rounded frame with a thin gold edge
  const sw = 850, sh = sw * (im.height / im.width);
  const sx = (W - sw) / 2, sy = H - sh - 26;
  const r = 34;
  g.save();
  g.shadowColor = 'rgba(247,213,110,0.35)';
  g.shadowBlur = 40;
  g.beginPath(); g.roundRect(sx, sy, sw, sh, r); g.fillStyle = INK; g.fill();
  g.restore();
  g.save();
  g.beginPath(); g.roundRect(sx, sy, sw, sh, r); g.clip();
  g.drawImage(im, sx, sy, sw, sh);
  g.restore();
  g.strokeStyle = 'rgba(247,213,110,0.75)';
  g.lineWidth = 3;
  g.beginPath(); g.roundRect(sx, sy, sw, sh, r); g.stroke();
  return c;
}

window.render = async (name, ...args) => {
  await document.fonts.load('100px Boldonse');
  await document.fonts.load("700 100px 'Big Shoulders'");
  if (name === 'framed') return (await framed(...args)).toDataURL('image/jpeg', 0.92);
  return (await PIECES[name]()).toDataURL('image/png');
};
